<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valentino AI Studio v2</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><h1>Valentino <span>AI Studio</span></h1><p>Narrações multilíngues com referência de voz</p></header><div class="layout"><section class="panel"><h2>Nova narração</h2><p id="system">Verificando ambiente...</p><label>Áudio de referência (use somente vozes autorizadas)</label><input id="voice" type="file" accept="audio/*,.mp4"><button id="upload">Enviar referência</button><p id="reference"></p><label>Idioma</label><select id="language">{% for code,name in languages.items() %}<option value="{{code}}">{{name}}</option>{% endfor %}</select><label>Texto do roteiro</label><textarea id="script" placeholder="Cole seu roteiro aqui..."></textarea><div class="meta"><span id="count">0 caracteres</span><span>Máximo 250.000</span></div><button class="primary" id="generate">Gerar narração</button><p class="hint">Processamento local em CPU pode demorar bastante. Faça primeiro um teste curto.</p></section><section class="panel"><h2>Suas gerações</h2><div id="jobs">Nenhum trabalho ainda.</div></section></div></main><script src="/static/app.js"></script></body></html>
